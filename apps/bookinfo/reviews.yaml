apiVersion: v1
kind: Service
metadata:
  name: reviews
  namespace: bookinfo
  labels: {app: reviews, service: reviews}
spec:
  selector: {app: reviews}
  ports:
    - {name: http, port: 9080, targetPort: 9080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-v1
  namespace: bookinfo
  labels: {app: reviews, version: v1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: reviews, version: v1}
  template:
    metadata:
      labels: {app: reviews, version: v1}
    spec:
      containers:
        - name: reviews
          image: docker.io/istio/examples-bookinfo-reviews-v1:1.20.2
          ports:
            - containerPort: 9080
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: wlp-output, mountPath: /opt/ibm/wlp/output}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: wlp-output, emptyDir: {}}
