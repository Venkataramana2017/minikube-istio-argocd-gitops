apiVersion: v1
kind: Service
metadata:
  name: details
  namespace: bookinfo
  labels: {app: details, service: details}
spec:
  selector: {app: details}
  ports:
    - {name: http, port: 9080, targetPort: 9080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: details-v1
  namespace: bookinfo
  labels: {app: details, version: v1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: details, version: v1}
  template:
    metadata:
      labels: {app: details, version: v1}
    spec:
      containers:
        - name: details
          image: docker.io/istio/examples-bookinfo-details-v1:1.20.2
          ports:
            - containerPort: 9080
